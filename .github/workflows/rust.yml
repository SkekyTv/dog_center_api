name: Rust

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

env:
  CARGO_TERM_COLOR: always
  POSTGRES_DATABASE: dog_center
  POSTGRES_USER: dog_center_api
  POSTGRES_PASSWORD: password123
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  DATABASE_URL: postgres://dog_center_api:password123@localhost/dog_center

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Start services with Docker Compose
        run: |
          docker-compose up -d
          sleep 10 # Wait for the database to initialize

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

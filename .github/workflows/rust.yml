name: Rust

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

env:
  CARGO_TERM_COLOR: always
  POSTGRES_DATABASE: dog_center
  POSTGRES_USER: dog_center_api
  POSTGRES_PASSWORD: password123
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  DATABASE_URL: postgres://dog_center_api:password123@localhost/dog_center

jobs:
  build:
    runs-on: ubuntu-latest
    container: skekyt/rust_ci:latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d
      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            nc -z localhost 5432 && echo "PostgreSQL is up" && exit 0;
            echo "Waiting for PostgreSQL...";
            sleep 2;
          done
          echo "PostgreSQL did not start in time" && exit 1;

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

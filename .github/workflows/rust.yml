name: Rust

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

env:
  CARGO_TERM_COLOR: always
  POSTGRES_DATABASE: dog_center
  POSTGRES_USER: dog_center_api
  POSTGRES_PASSWORD: password123
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  DATABASE_URL: postgres://dog_center_api:password123@localhost/dog_center

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: skekyt/rust_ci:latest
      options: --privileged

    steps:
      - name: Check Docker Compose version
        run: |
          docker compose version || docker-compose version
      - name: Rustup version
        run: rustup default stable

      - name: Check out code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d
      - name: Wait for PostgreSQL
        run: |
          #!/bin/sh
          echo "Waiting for PostgreSQL..."
          until PGPASSWORD=$POSTGRES_PASSWORD psql -h "localhost" -U "$POSTGRES_USER" -c '\q'; do
            >&2 echo "PostgreSQL is unavailable - sleeping"
            sleep 2
          done
          echo "PostgreSQL is up"

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

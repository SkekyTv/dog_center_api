name: dog-center-infra
services:
  postgres:
    image: postgres:17.2-bookworm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"

networks:
  # default:
  #   driver: bridge
  host:
    name: host

volumes:
  postgres-data:
